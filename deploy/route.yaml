apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: janus-prd
  name: janus  # this is the name that will appear in the url janus-{ns}-xxxxxx
spec:
  port:
    targetPort: 9860-tcp
  to:
    kind: Service
    name: janus-prd
    weight: 100
  wildcardPolicy: None
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect